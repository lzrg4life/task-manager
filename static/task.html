<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Task – Task Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/app.css?v=5">
</head>
<body>
  <main class="card wide fixed-head">
    <div class="row">
      <h1 id="heading">New task</h1>
      <span><button type="submit" form="task-form" style="min-width: 8rem">Save</button></span>
    </div>
    <div class="scroll-body">
    <p id="error" class="error" role="alert" hidden></p>
    <form id="task-form">
      <p><span id="readonly-note" class="badge" hidden>Archived – read-only (change status to restore)</span></p>
      <label>Title <input type="text" name="title" maxlength="200" required></label>
      <div class="grid">
        <label>Status <select name="status"></select></label>
        <label>Priority <select name="priority"></select></label>
        <label>Reviewer <select name="reviewer_id"></select></label>
        <label>Implementer <select name="implementer_id"></select></label>
      </div>
      <label>Details <textarea name="details" rows="4"></textarea></label>
      <label>Business requirements <textarea name="business_requirements" rows="4"></textarea></label>
      <label>Technical requirements <textarea name="technical_requirements" rows="4"></textarea></label>
      <label>Implementation notes <textarea name="implementation_notes" rows="4"></textarea></label>
      <p id="meta"></p>
    </form>
    <section id="comments-section" class="list" hidden>
      <h2>Comments</h2>
      <p id="comments-error" class="error" role="alert" hidden></p>
      <div id="comments" class="comment-thread"></div>
      <form id="comment-form" class="comment-form">
        <label for="comment-input">Add a comment</label>
        <textarea id="comment-input" name="body" maxlength="5000" required></textarea>
        <button type="submit">Add comment</button>
      </form>
    </section>
    <section id="blocked-section" class="list" hidden>
      <h2>Blocked</h2>
      <p id="blocked-note"></p>
      <form id="block-form" class="link-form">
        <input type="text" name="reason" placeholder="Reason for blocking" maxlength="500" required>
        <button type="submit">Block task</button>
      </form>
      <button type="button" id="unblock-btn" class="secondary" hidden>Unblock</button>
    </section>
    <section id="tags-section" class="list" hidden>
      <h2>Tags</h2>
      <p id="no-tags">No tags are available.</p>
      <div id="tags" class="tag-list"></div>
    </section>
    <section id="links-section" class="list" hidden>
      <h2>Links</h2>
      <ul id="links" class="links"></ul>
      <p id="no-links">No links.</p>
      <form id="link-form" class="link-form">
        <input type="text" name="url" placeholder="https://example.com/page" maxlength="2000" required>
        <input type="text" name="label" placeholder="Label (optional)" maxlength="200">
        <button type="submit">Add link</button>
      </form>
    </section>
    <section id="related-section" class="list" hidden>
      <h2>Related tasks</h2>
      <ul id="related-tasks" class="links"></ul>
      <p id="no-related-tasks">No related tasks.</p>
      <form id="related-search-form" class="link-form">
        <input type="text" name="query" placeholder="Search by task key or title" maxlength="200" required>
        <button type="submit">Search</button>
      </form>
      <ul id="related-search-results" class="links" aria-live="polite"></ul>
    </section>
    <section id="history-section" class="list" hidden>
      <h2>History</h2>
      <table><thead><tr><th>When</th><th>Field</th><th>From</th><th>To</th><th>By</th></tr></thead><tbody id="history"></tbody></table>
    </section>
    </div>
  </main>
  <script type="module" src="/js/task.js?v=2"></script>
</body>
</html>
