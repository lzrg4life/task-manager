<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tasks – Task Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/app.css?v=5">
</head>
<body>
  <main class="card wide">
    <div class="row">
      <h1>Tasks</h1>
      <div class="task-toolbar">
        <button type="button" id="toggle-filters" class="secondary" aria-expanded="false" aria-controls="task-filters">Show filters</button>
        <a class="button" href="/task.html">New task</a>
      </div>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="task-filters" class="grid" hidden>
      <label for="task-search">Filter by task ID or title
        <input id="task-search" type="text" autocomplete="off" placeholder="e.g. TM-12 or Update login page">
      </label>
      <label for="task-assignee">Filter by reviewer or implementer
        <select id="task-assignee">
          <option value="">All people</option>
        </select>
      </label>
      <label for="task-tags">Filter by tags (tasks must have all selected tags)
        <select id="task-tags" multiple size="4"></select>
      </label>
    </div>
    <div id="board"></div>
  </main>
  <dialog id="archive-dialog" aria-labelledby="archive-title">
    <h2 id="archive-title">Archive task?</h2>
    <p id="archive-message"></p>
    <p id="archive-error" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" id="archive-cancel" class="secondary">Cancel</button>
      <button type="button" id="archive-confirm">Archive task</button>
    </div>
  </dialog>
  <script type="module" src="/js/tasks.js?v=5"></script>
</body>
</html>
