<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Removed tickets – Task Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="card wide">
  <div class="row">
    <h1>Removed tickets</h1>
    <button type="button" id="toggle-filters" class="secondary" aria-expanded="false" aria-controls="ticket-filters">Show filters</button>
  </div>
  <p id="error" class="error" role="alert" hidden></p>
  <div id="ticket-filters" class="grid" hidden>
    <label for="ticket-search">Filter by ticket ID or title
      <input id="ticket-search" type="text" autocomplete="off" placeholder="e.g. TM-12 or Update login page">
    </label>
    <label for="ticket-assignee">Filter by reviewer or implementer
      <select id="ticket-assignee">
        <option value="">All people</option>
      </select>
    </label>
    <label for="ticket-tags">Filter by tags (tickets must have all selected tags)
      <select id="ticket-tags" multiple size="4"></select>
    </label>
  </div>
  <section class="list"><div id="list" data-kind="removed"></div></section>
</main>
  <script type="module" src="/js/ticket-pages.js?v=3"></script>
</body>
</html>
