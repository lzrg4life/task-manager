<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tickets – Task Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/css/app.css?v=3">
</head>
<body>
  <main class="card wide">
    <div class="row">
      <h1>Tickets</h1>
      <div class="ticket-toolbar">
        <button type="button" id="toggle-filters" class="secondary" aria-expanded="false" aria-controls="ticket-filters">Show filters</button>
        <a class="button" href="/ticket.html">New ticket</a>
      </div>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="ticket-filters" class="grid" hidden>
      <label for="ticket-search">Filter by ticket ID or title
        <input id="ticket-search" type="text" autocomplete="off" placeholder="e.g. TM-12 or Update login page">
      </label>
      <label for="ticket-assignee">Filter by reviewer or implementer
        <select id="ticket-assignee">
          <option value="">All people</option>
        </select>
      </label>
    </div>
    <div id="board"></div>
  </main>
  <dialog id="archive-dialog" aria-labelledby="archive-title">
    <h2 id="archive-title">Archive ticket?</h2>
    <p id="archive-message"></p>
    <p id="archive-error" class="error" role="alert" hidden></p>
    <div class="row">
      <button type="button" id="archive-cancel" class="secondary">Cancel</button>
      <button type="button" id="archive-confirm">Archive ticket</button>
    </div>
  </dialog>
  <script type="module" src="/js/tickets.js?v=3"></script>
</body>
</html>
